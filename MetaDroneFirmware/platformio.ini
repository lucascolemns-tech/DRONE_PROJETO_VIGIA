[env]
    monitor_speed = 115200

[env:esp32doit-devkit-v1]
    platform = espressif32
    board = esp32doit-devkit-v1
    framework = arduino
    upload_speed = 115200
    lib_compat_mode = strict
    build_src_filter = +<mainESP32.cpp> +<INTERNET/> +<COMM_ESP/> +<_AUX_ESP/> -<mainSTM32.cpp> -<BMP/> -<MPU/> -<PID/> -<KALMAN/> -<ESC/> -<teste/> -<output/>
    build_flags =
        -I src/INTERNET
        -I src/COMM_ESP
        -I src/ESC
        -Wall
        -Wextra
    lib_deps =
        https://github.com/Every-Flavor-Robotics/Adafruit_AHRS.git
        https://github.com/r-downing/AutoPID.git
        madhephaestus/ESP32Servo@^3.2.1

[env:blackpill_f411ce]
    platform = ststm32
    board = blackpill_f411ce
    framework = arduino
    debug_tool = stlink
    debug_build_flags = -O0 -g -ggdb
    upload_protocol = stlink
    build_src_filter = +<mainSTM32.cpp> +<BMP/> +<MPU/> +<PID/> +<KALMAN/> +<ESC/> +<COMM_STM/> +<_AUX_STM/> +<VL53L0/> +<NEO6M/> +<Hmc5883l/> -<mainESP32.cpp> -<INTERNET/> -<teste/> -<output/>
    build_flags =
        -DSTM32_DEBUG_UART=1
        -DUSAR_MAG=1
        -DUSAR_GPS=0
        -DUSAR_DISTSENSOR=0
        -DUSBCON
        -DUSBD_USE_CDC
        -I src/BMP
        -I src/MPU
        -I src/PID
        -I src/KALMAN
        -I src/ESC
        -I src/COMM_STM
        -I src/VL53L0
        -I src/NEO6M
        -I src/Hmc5883l
        -Wall
        -Wextra

    lib_deps =
        https://github.com/Every-Flavor-Robotics/Adafruit_AHRS.git
        https://github.com/r-downing/AutoPID.git
        stm32duino/STM32duino VL53L0X@2.0.1
        mikalhart/TinyGPSPlus@^1.0.3
        adafruit/Adafruit HMC5883 Unified@^1.2.0


